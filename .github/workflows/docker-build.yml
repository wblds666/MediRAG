name: docker-build

# 在 GitHub 的 Ubuntu 机器上真机构建镜像，验证 Dockerfile（含 libGL/libglib 依赖）
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "app.py"
      - "static/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t medrag-api:test .

      - name: 验证 OCR 依赖（cv2 / libGL 是否装好）
        run: docker run --rm medrag-api:test python -c "import cv2; print('cv2 OK', cv2.__version__)"

      - name: 验证应用可导入（FastAPI / LangChain 依赖齐全）
        run: docker run --rm medrag-api:test python -c "import app; print('app import OK')"

      - name: 校验 compose 编排语法
        run: docker compose config -q

      - name: 镜像体积
        run: docker images medrag-api:test --format '镜像大小={{.Size}}'

      - name: 写入运行摘要
        if: always()
        shell: bash
        run: |
          CV2=$(docker run --rm medrag-api:test python -c 'import cv2, sys; sys.stdout.write(cv2.__version__)' 2>/dev/null || echo '未通过')
          APP=$(docker run --rm medrag-api:test python -c 'import app' 2>/dev/null && echo ok || echo '未通过')
          COMPOSE=$(docker compose config -q 2>/dev/null && echo ok || echo '未通过')
          SIZE=$(docker images medrag-api:test --format '{{.Size}}')

          {
            echo "### Docker 构建验证"
            echo ""
            echo "| 检查项 | 结果 |"
            echo "| --- | --- |"
            echo "| 镜像构建 | ${{ job.status }} |"
            echo "| OCR 依赖 (cv2) | ${CV2} |"
            echo "| 应用导入 (app) | ${APP} |"
            echo "| compose 语法 | ${COMPOSE} |"
            echo "| 镜像体积 | ${SIZE} |"
          } >> "$GITHUB_STEP_SUMMARY"
