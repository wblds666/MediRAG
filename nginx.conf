# =============================================================================
# MediRAG Nginx 配置（最简可用版）
# 作用：① 直接对外提供前端静态页面（快，不占 Python 进程）
#       ② 把 /api/ 请求反向代理给 FastAPI 容器（浏览器只跟 Nginx 打交道，同源无跨域问题）
#       ③ 统一记录访问日志、限制上传大小、放大超时（大模型生成慢）
# 用法：docker run -d -p 8080:80 \
#         -v $PWD/nginx.conf:/etc/nginx/nginx.conf:ro \
#         -v $PWD/static:/usr/share/nginx/html:ro nginx:1.27-alpine
# =============================================================================
user  nginx;
worker_processes  auto;                     # 跟随 CPU 核数

events {
    worker_connections  1024;
}

http {
    include       mime.types;               # 按扩展名返回正确的 Content-Type
    default_type  application/octet-stream;

    # ---------- 日志：Nginx 这一层也要有日志，和应用的业务日志互补 ----------
    # $request_time 是 Nginx 看到的耗时，$upstream_response_time 是后端处理的耗时：
    # 两个一比就知道"慢在网关还是在应用"
    log_format  medrag  '$remote_addr - [$time_local] "$request" $status '
                        '$body_bytes_sent rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  medrag;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;                     # 零拷贝发文件，静态资源更快
    keepalive_timeout  65;
    client_max_body_size 60m;               # 医疗教材 PDF 常见几十 MB，和应用的 MAX_UPLOAD_MB 对齐
    gzip on;                                # 压缩文本响应，省带宽
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript;

    # ---------- 后端集群：名字 api 是 docker-compose 里的服务名，DNS 自动解析 ----------
    upstream medrag_api {
        server api:8000;
        keepalive 32;                       # 与后端保持长连接，减少握手开销
    }

    server {
        listen       80;
        server_name  _;

        # 前端页面目录（docker-compose 把 ./static 挂到这里）
        root  /usr/share/nginx/html;
        index index.html;

        # ---------- 静态页面 ----------
        location / {
            try_files $uri $uri/ /index.html;   # 单页应用找不到文件就交给 index.html
        }

        location ~* \.(css|js|png|jpg|svg|ico)$ {
            expires 1h;                          # 静态资源浏览器缓存 1 小时
            add_header Cache-Control "public";
        }

        # ---------- 反向代理：前端所有 /api/xxx 请求都转给 FastAPI ----------
        location /api/ {
            proxy_pass         http://medrag_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;   # 后端日志里能看到真实客户端 IP
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # 大模型生成一句话可能要几十秒，读超时必须放大，否则会 504
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # 关闭缓冲：将来接流式输出（SSE 逐字返回）时，才能让字"实时"到浏览器
            proxy_buffering off;
        }
    }
}
