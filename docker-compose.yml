# =============================================================================
# MediRAG 一键起三件套：Nginx(前端+网关) + FastAPI(业务) + Ollama(大模型)
# 使用：
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen2.5:7b     # 首次必须拉模型
#   docker compose exec ollama ollama pull bge-m3
#   浏览器打开 http://localhost:8080
# =============================================================================
services:
  # ---------- 业务后端：FastAPI + LangChain ----------
  api:
    build: .
    image: medrag-api:1.0
    container_name: medrag-api
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434     # 用服务名互访，不用写 IP
      - LLM_MODEL=qwen2.5:7b
      - EMBED_MODEL=bge-m3
      - TOP_K=4
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data                        # 数据库 + 原始文件：容器重建也不丢
      - ./logs:/app/logs                        # 应用日志挂出来，方便直接看/采集
    depends_on:
      - ollama
    restart: unless-stopped
    # 开发期想直接调后端接口可以打开下面这行，生产只暴露 Nginx 就够了
    # ports: ["8000:8000"]

  # ---------- 网关 + 前端静态资源 ----------
  web:
    image: nginx:1.27-alpine
    container_name: medrag-web
    ports:
      - "8080:80"                               # 宿主机 8080 → 容器 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro   # 挂配置进去，改完 restart 即可生效
      - ./static:/usr/share/nginx/html:ro       # 前端页面目录
      - ./logs/nginx:/var/log/nginx             # Nginx 日志和业务日志放一起，便于统一采集
    depends_on:
      - api
    restart: unless-stopped

  # ---------- 本地大模型服务（Ollama） ----------
  ollama:
    image: ollama/ollama:latest
    container_name: medrag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama             # 模型很大，必须用命名卷持久化
    restart: unless-stopped
    # 有 NVIDIA 显卡时打开下面配置，推理速度提升明显（需先装 nvidia-container-toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-models:
